# dep-scan composite action — v3 packaging of the ci/v2.x `dep-scan` reusable.
# The run body is a VERBATIM PORT (PLAN-025 §1) apart from the `timeout` wrapper
# and the precondition guard, both of which are additive.
#
# CHECKOUT IS THE CALLER'S JOB (§3.2).
#
# ── DEFENSES CARRIED (PLAN-025 §2 — do not remove) ───────────────────────────
#   D20  The osv-scanner binary is SHA-256 verified BEFORE it is made executable.
#        A release asset is mutable state on infrastructure we do not control.
#   D21  osv-scanner is installed as a BINARY, never via google/osv-scanner-action:
#        canon may only `uses:` actions/*, github/*, vladm3105/*, and a
#        non-allowlisted action is a run-init startup_failure with a web-UI-only
#        message actionlint cannot catch. THIS is why the body is 60 lines of
#        shell instead of a three-line wrapper.
#   D24  `--no-call-analysis=all` is LOAD-BEARING. osv-scanner's Go call-analysis
#        is ON BY DEFAULT and COMPILES SOURCE — arbitrary code execution at scan
#        time, on the self-hosted pool. NEVER remove that flag.
#   D12  Zero-coverage guard. Exit 128 means no manifests matched, i.e. the gate
#        scanned NOTHING. A security check that inspected nothing must not pass
#        silently; when manifests are expected AND the gate is blocking, it fails.
#   D14  `fail-on-findings` is a real toggle the body honours with `exit 1`, not
#        an incapacity. PLAN-014 Phase 5 graduates it to true — a founder step.
#   D15  `set -euo pipefail` under GitHub's implicit `bash -e`.
#
# ── WHAT IS **NOT** HERE, DELIBERATELY (§3.2a) ───────────────────────────────
#   D27  The fork guard is a JOB-LEVEL `if:` and stays on the CALLER. A
#        step-level skip runs AFTER the job has already checked the fork's code
#        out, which turns an admission guard into a no-op.
#   D35  The SARIF upload stays a CALLER step. `continue-on-error` inside a
#        composite action is undocumented; if unsupported, a private repo
#        without GHAS turns a documented 403 no-op into a hard red on every PR.
name: dep-scan
description: SCA via osv-scanner (binary, checksum-verified, data-only).

inputs:
  scan-path:
    description: 'Path to scan recursively.'
    required: false
    default: '.'
  fail-on-findings:
    description: 'Fail on known-vulnerable dependencies. Default false — PLAN-014 Phase 5 graduates this, and that is a founder step.'
    required: false
    default: 'false'
  expect-manifests:
    description: 'This repo is expected to HAVE dependency manifests. With fail-on-findings, a zero-coverage scan then fails instead of passing quietly (D12). Set false for a dependency-free repo.'
    required: false
    default: 'true'
  sarif-path:
    description: 'Where to write the SARIF the caller uploads.'
    required: false
    default: 'osv.sarif'

runs:
  using: composite
  steps:
    - name: Verify precondition — a checked-out tree
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -e .git ]; then
          echo "::error::dep-scan action: no checkout detected. The CALLER must check out before invoking this action (PLAN-025 §3.2)."
          exit 1
        fi

    - name: Run osv-scanner (binary; data-only SCA)
      shell: bash
      env:
        OSV_VERSION: "2.4.0"
        OSV_LINUX_AMD64_SHA256: "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0"
        FAIL: ${{ inputs.fail-on-findings }}
        SCAN_PATH: ${{ inputs.scan-path }}
        EXPECT_MANIFESTS: ${{ inputs.expect-manifests }}
        SARIF: ${{ inputs.sarif-path }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null 2>&1 || { echo "::error::jq not found on the runner — infrastructure error, not a finding."; exit 1; }
        curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o /tmp/osv-scanner
        printf '%s  %s\n' "$OSV_LINUX_AMD64_SHA256" /tmp/osv-scanner | sha256sum --check --strict
        BIN_DIR="$RUNNER_TEMP/bin"; mkdir -p "$BIN_DIR"
        mv /tmp/osv-scanner "$BIN_DIR/osv-scanner"; chmod 0755 "$BIN_DIR/osv-scanner"

        summary() { echo "dep-scan: $1" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"; }

        # DATA-ONLY scan. `--no-call-analysis=all` is LOAD-BEARING: osv-scanner's Go
        # call-analysis is ON BY DEFAULT and compiles source (code execution) — this
        # keeps the scan to manifest/lockfile READING only. Never remove it.
        # `timeout 900` (§3.2b): one hung scan must fail this check, not eat the
        # whole consolidated job's budget.
        rc=0
        timeout 900 "$BIN_DIR/osv-scanner" scan source -r --no-call-analysis=all \
          --format sarif --output-file "$SARIF" "$SCAN_PATH" || rc=$?

        # osv-scanner exit codes: 0 = scanned, no vulns · 1–126 = vulnerabilities found
        # · 127 = general error · 128 = no packages found · 129–255 = other errors.
        # 124 is `timeout`'s own code and lands in the "other errors" arm below,
        # which is correct: a timed-out scan is an infrastructure failure, not clean.
        if [ "$rc" -eq 0 ]; then
          echo "::notice::dep-scan: no known-vulnerable dependencies."
          summary "clean — packages scanned, no known vulnerabilities."
        elif [ "$rc" -eq 128 ]; then
          # No manifests matched. A security gate that scanned NOTHING must not pass
          # silently — surface it as a warning, and (when expected + blocking) fail.
          echo "::warning::dep-scan: no supported manifests/lockfiles found under '${SCAN_PATH}' — scanned NOTHING (coverage gap). If this repo genuinely has no dependencies, set expect-manifests:false; otherwise check scan-path / the ecosystem."
          summary "⚠️ NO manifests found — scanned nothing (coverage gap)."
          if [ "$EXPECT_MANIFESTS" = "true" ] && [ "$FAIL" = "true" ]; then
            echo "::error::dep-scan: expected dependency manifests but found none — failing (zero-coverage on a blocking gate). Set expect-manifests:false for a dependency-free repo."; exit 1
          fi
        elif [ "$rc" -ge 1 ] && [ "$rc" -le 126 ]; then
          # Vulnerability-result range: findings ARE expected. Cross-check the SARIF.
          n=0
          [ -s "$SARIF" ] && n=$(jq '[.runs[].results[]] | length' "$SARIF" 2>/dev/null || echo 0)
          case "$n" in ''|*[!0-9]*) n=0 ;; esac
          if [ "$n" -gt 0 ]; then
            echo "::warning::dep-scan: $n known-vulnerable-dependency finding(s) — see $SARIF / the Security tab."
            summary "❌ $n known-vulnerable-dependency finding(s) (osv-scanner exit $rc)."
            if [ "$FAIL" = "true" ]; then
              echo "::error::dep-scan: failing the gate (fail-on-findings: true)."; exit 1
            fi
            echo "::notice::dep-scan: report-only (fail-on-findings: false) — not blocking. Flip fail-on-findings to gate."
          else
            # Contradiction: the tool signalled findings but the SARIF is empty/unparseable —
            # a possible MISSED finding (SARIF write/parse failure), NOT clean, NOT mere infra.
            echo "::error::dep-scan: osv-scanner signalled findings (exit $rc) but the SARIF has no parseable results — a SARIF write/parse failure that may be MASKING a real finding. Treated as a failure, not clean."
            summary "❌ osv-scanner signalled findings (exit $rc) but SARIF unparseable — possible missed finding."
            exit 1
          fi
        else
          # 127 or 129–255 (including 124, timeout): genuine infrastructure/tool error.
          echo "::error::dep-scan: osv-scanner exited $rc (tool/infrastructure error, not a finding). Re-run."; exit 1
        fi
