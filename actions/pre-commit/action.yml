# pre-commit composite action — v3 packaging of the ci/v2.x `pre-commit`
# reusable. The two run bodies are VERBATIM PORTS (PLAN-025 §1).
#
# CHECKOUT IS THE CALLER'S JOB (§3.2). Unlike the reusable this does not check
# out; the consolidating job checks out once and every action shares the tree.
#
# DEFENSES CARRIED (PLAN-025 §2 — do not remove):
#   D5   actions/* SHA-pinned, never tag-pinned.
#   D11  This is the check that reads the consumer's hook config. It runs at the
#        DEFAULT (`pre-commit`) stage unless `run-stage` says otherwise — a
#        config with no commit-stage hook makes it match zero hooks and exit 0,
#        "a green required check that inspected nothing". The precondition guard
#        below is what turns that silent pass into a loud failure.
#   D15  `set -euo pipefail` under GitHub's implicit `bash -e`.
#   Injection: consumer inputs go through `env:`, never source interpolation
#        (sec H4). `extra-deps` is parsed into an array so shell metacharacters
#        stay inert and argument boundaries are explicit.
name: pre-commit
description: Run the repo's pre-commit hooks against every file.

inputs:
  python-version:
    description: 'Python version for the pre-commit install.'
    required: false
    default: '3.12'
  pre-commit-version:
    description: 'Pinned pre-commit version. Pinned, not floating — a new release changing hook selection would land fleet-wide unannounced.'
    required: false
    default: '4.0.1'
  extra-deps:
    description: 'Additional pip args (e.g. "-r tests/requirements.txt") for hooks needing project deps.'
    required: false
    default: ''
  run-stage:
    description: 'Hook stage. Empty runs the default commit-stage hooks. "manual" for opt-in audits.'
    required: false
    default: ''
  config-path:
    description: 'Path to the pre-commit config, for the precondition guard.'
    required: false
    default: '.pre-commit-config.yaml'

runs:
  using: composite
  steps:
    # PLAN-025 §3.2: each action verifies the precondition it depends on and
    # fails loudly if unmet. A consolidated job that checked out nothing (or
    # checked out without the config) would otherwise report green having
    # inspected nothing — the D11 failure shape, re-created by consolidation.
    - name: Verify precondition — a checked-out tree with a hook config
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        set -euo pipefail
        if [ ! -e .git ] && [ ! -f "${CONFIG_PATH}" ]; then
          echo "::error::pre-commit action: no checkout detected and no ${CONFIG_PATH}. The CALLER must check out before invoking this action (PLAN-025 §3.2)."
          exit 1
        fi
        if [ ! -f "${CONFIG_PATH}" ]; then
          echo "::error::pre-commit action: ${CONFIG_PATH} not found. Refusing to report success without inspecting anything (PLAN-025 D11)."
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pre-commit (+ optional extra deps)
      shell: bash
      env:
        EXTRA_DEPS: ${{ inputs.extra-deps }}
        PRE_COMMIT_VERSION: ${{ inputs.pre-commit-version }}
      run: |
        set -euo pipefail
        # Parse the documented pip-argument string into an array. Environment
        # indirection keeps shell metacharacters inert; array expansion avoids
        # accidental globbing and preserves the argument boundary explicitly.
        extra_args=()
        [ -z "$EXTRA_DEPS" ] || read -r -a extra_args <<< "$EXTRA_DEPS"
        python -m pip install --disable-pip-version-check "pre-commit==${PRE_COMMIT_VERSION}" "${extra_args[@]}"

    - name: Run hooks
      shell: bash
      env:
        RUN_STAGE: ${{ inputs.run-stage }}
      run: |
        set -euo pipefail
        # env indirection (sec H4): RUN_STAGE via env, not source interpolation.
        if [ -n "$RUN_STAGE" ]; then
          timeout 900 pre-commit run --all-files --show-diff-on-failure --hook-stage "$RUN_STAGE"
        else
          timeout 900 pre-commit run --all-files --show-diff-on-failure
        fi
