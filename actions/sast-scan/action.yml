# sast-scan composite action — v3 packaging of the ci/v2.x `sast-scan` reusable.
# The run body is a VERBATIM PORT (PLAN-025 §1) apart from the `timeout` wrapper
# and the precondition guard, both additive.
#
# CHECKOUT IS THE CALLER'S JOB (§3.2).
#
# ── DEFENSES CARRIED (PLAN-025 §2 — do not remove) ───────────────────────────
#   D23  **THE GATE, NOT THE SCANNED PR, DECIDES COVERAGE.** semgrep always
#        honours a `.semgrepignore` INDEPENDENTLY of `--config`, so a PR that
#        commits `.semgrepignore` containing `*` makes the scan cover zero files
#        → a silent green → complete SAST-gate bypass. VERIFIED, not theoretical.
#        The body strips any PR-supplied ignore/rc file before scanning. A repo
#        needing a real exclusion must express it GATE-SIDE, never via a
#        PR-mutable file.
#   D26  Explicit `--config` (registry ruleset), NEVER repo-local
#        auto-discovery — a PR cannot inject its own rules. `--metrics off`
#        sends no telemetry, which matters for private repos.
#   D21  semgrep is a version-pinned pip install into an isolated venv, not the
#        marketplace action — a non-allowlisted publisher is a run-init
#        startup_failure. (Note D20 does NOT apply: this is pip, not a curl'd
#        release artifact, and full transitive hash-pinning is impractical for
#        this dep tree. Version-pin is the accepted baseline per PLAN-014 §3.)
#   D15  `set -euo pipefail`.
#
#   Fail-loud-on-broken-report: rc==0 with a missing or unparseable SARIF is an
#   INFRASTRUCTURE error, never "no findings". That silent green is the specific
#   thing this gate exists to prevent.
#
# ── NOT HERE, DELIBERATELY (§3.2a) ───────────────────────────────────────────
#   D27  Fork guard is a JOB-LEVEL `if:` on the CALLER.
#   D35  SARIF upload stays a CALLER step.
#
# KNOWN ISSUE: semgrep cannot install on the current self-hosted image (no
# python3-venv, aidoc-flow-ci#349). The port does not fix that — it is an image
# problem, and the action fails loudly rather than silently skipping.
name: sast-scan
description: SAST via semgrep (version-pinned pip venv, explicit ruleset, data-only).

inputs:
  scan-path:
    description: 'Path to scan. MUST be "." (the repo root) — a narrower subtree is a COVERAGE choice and is REFUSED (D26/§4.3i), because the caller is PR-mutable on pull_request.'
    required: false
    default: '.'
  config:
    description: 'Semgrep ruleset. GATE-APPROVED VALUES ONLY: p/default, p/security-audit, p/python — anything else is REFUSED (D26/§4.3i). A local path, a URL, or a narrow/one-rule ref is a COVERAGE choice, and the caller is PR-mutable on pull_request.'
    required: false
    default: 'p/default'
  fail-on-findings:
    description: 'Fail on findings. Default false — PLAN-014 Phase 5 graduates this, a founder step.'
    required: false
    default: 'false'
  sarif-path:
    description: 'Where to write the SARIF the caller uploads.'
    required: false
    default: 'semgrep.sarif'
  autofix-preview:
    description: 'ALSO run semgrep --autofix in the ephemeral workspace and surface the patch in the job summary. PREVIEW ONLY — nothing is pushed (PLAN-014 §4a Phase 4).'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Verify precondition — a checked-out tree
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -e .git ]; then
          echo "::error::sast-scan action: no checkout detected. The CALLER must check out before invoking this action (PLAN-025 §3.2)."
          exit 1
        fi

    - name: Run semgrep (pip venv; static SAST, data-only)
      shell: bash
      env:
        SEMGREP_VERSION: "1.170.0"
        FAIL: ${{ inputs.fail-on-findings }}
        CONFIG: ${{ inputs.config }}
        SCAN_PATH: ${{ inputs.scan-path }}
        SARIF: ${{ inputs.sarif-path }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null 2>&1 || { echo "::error::jq not found on the runner — infrastructure error, not a finding."; exit 1; }
        command -v python3 >/dev/null 2>&1 || { echo "::error::python3 not found on the runner — infrastructure error, not a finding."; exit 1; }

        summary() { echo "sast-scan: $1" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"; }

        # D26, ENFORCED — the claim below used to be prose only.
        #
        # "Explicit --config, never repo-local auto-discovery → a PR cannot inject
        # rules" was true of DISCOVERY and false of the INPUT. `config` is supplied by
        # the CALLER, and on `on: pull_request` the caller's workflow file comes from
        # the PR HEAD — the same access level D23 already assumes. semgrep's --config
        # takes a registry ref, A LOCAL PATH, or A URL. So `config: ./empty.yaml`
        # (or an attacker-hosted URL) yields a zero-rule scan that exits 0 with a
        # legitimate empty SARIF → `n=0` → `::notice::no SAST findings` → GREEN, having
        # checked nothing. That is the D23 shape reached through the other door.
        #
        # Restrict to the semgrep REGISTRY namespaces the docs and every shipped caller
        # already use (`p/` rulesets, `r/` individual rules). This is not a tuning
        # limit: `install/templates/workflows/{sast-scan,scanners}.yml` document
        # exactly `p/default`, `p/security-audit`, `p/python`. A repo needing a bespoke
        # ruleset publishes it to the registry or asks canon for an input — the point
        # of a gate is that the SCANNED code does not choose its own rules.
        #
        # NOT claimed: `fail-on-findings` is also caller-supplied, and canon itself
        # ships it `false` for the report-only rollout, so a PR setting it false is not
        # an escalation beyond the shipped default. Coverage is what this closes.
        cfg_safe="$(printf '%s' "$CONFIG" | tr '\n\r' '??' | cut -c1-200)"
        # AN EXACT SET, not a namespace prefix. A `p/*|r/*` prefix check was the first
        # draft and it does not deliver what D26 claims: `r/` addresses an INDIVIDUAL
        # registry rule, so `config: r/generic.comment.something` passes the prefix,
        # resolves to a real ruleset of ONE rule, exits 0 with a valid SARIF and n=0,
        # and the gate goes green having scanned essentially nothing. So does a narrow
        # pack like `p/comment`. The original bypass took coverage to zero rules; a
        # prefix check takes it to one. That is not a fix, it is a smaller number.
        # A prefix is also only a prefix: `p/../s/<attacker-snippet>` matches `p/*`.
        #
        # The gate therefore NAMES the rulesets it accepts. These are exactly the ones
        # canon ships and documents, so no shipped caller and no documented example
        # changes. A repo needing a different pack asks canon to add it here — which is
        # the point: THE GATE decides coverage, not the scanned code.
        case "$CONFIG" in
          p/default|p/security-audit|p/python) ;;
          *) echo "::error::sast-scan: config must be one of the gate-approved rulesets (p/default, p/security-audit, p/python); got '${cfg_safe}'. A PR-chosen ruleset is a COVERAGE choice — a narrow or one-rule config exits 0 with a valid empty SARIF and the gate goes green having checked nothing (D26). To add a ruleset, change it in canon, not in the caller."; exit 1 ;;
        esac


        # semgrep is Python — VERSION-pinned pip into an isolated venv (full transitive
        # hash-pinning is impractical for a large dep tree; version-pin is the accepted
        # supply-chain baseline for a pip tool — PLAN-014 §3). pip runs PyPI build code
        # at install time, but the runner is ephemeral (--rm, non-root, one
        # job then destroyed), so install-time blast radius is one job.
        VENV="$RUNNER_TEMP/sgvenv"
        python3 -m venv "$VENV"
        "$VENV/bin/pip" install --quiet --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"

        # ── D23 (ORIGIN surface — parity with the #425 extensions) ───────────
        # THE GATE — NOT THE SCANNED PR — DECIDES COVERAGE. semgrep ALWAYS honors a
        # `.semgrepignore` (gitignore syntax) INDEPENDENTLY of --config, so a PR that
        # commits `.semgrepignore` containing `*` makes the scan cover zero files → a
        # silent green → complete SAST-gate bypass (VERIFIED). Strip any PR-supplied
        # ignore/rc file before scanning; semgrep then falls back to its built-in
        # defaults (which still skip vendored dirs). A repo that needs a real exclusion
        # must express it gate-side (the ruleset / a future input), never via a
        # PR-mutable file.
        #
        # `-type f` MISSES A SYMLINK, and git stores symlinks natively (mode
        # 120000). A PR commits `.semgrepignore` as a symlink to any file
        # containing `*`; the strip skips it, semgrep follows the link, coverage
        # goes to zero and the gate goes green — the very bypass D23 closes.
        # REPRODUCED 2026-08-08. Also strip from the repo ROOT, because semgrep
        # resolves the ignore file from CWD, not from SCAN_PATH.
        #
        # scan-path is an INPUT, and on `pull_request` the caller's workflow file comes
        # from the PR HEAD — the same access level D23 already assumes. `find` reads its
        # first operand as an OPTION when it begins with `-`: `scan-path: -delete` makes
        # this `find -delete \( … \) …`, which has NO path operand, so `-delete` (which
        # implies `-depth`) evaluates against the whole tree. MEASURED on the dep-scan
        # and trivy-scan siblings: it EMPTIES THE WORKSPACE — here that also destroys
        # `osv.sarif` and `trivy.sarif` already written by the two preceding steps of
        # `scanners.yml`, so all three uploads silently no-op on their `hashFiles`
        # guards. The post-condition then finds nothing and certifies the empty tree
        # clean: the strip becomes the bypass. Validate before the value reaches find.
        # This guard is the one piece #425 gave the two extensions and not the origin.
        sp_safe="$(printf '%s' "$SCAN_PATH" | tr '\n\r' '??' | cut -c1-200)"
        case "$SCAN_PATH" in
          -*) echo "::error::sast-scan: scan-path may not begin with '-' (got '${sp_safe}') — refusing rather than handing it to find as an option (D23)."; exit 1 ;;
        esac
        if [ ! -d "$SCAN_PATH" ]; then
          echo "::error::sast-scan: scan-path '${sp_safe}' is not an existing directory — refusing rather than reporting a clean scan of nothing (D23)."
          exit 1
        fi
        # The repo ROOT is a SECOND strip root, not a separate `rm -f`: semgrep
        # resolves the ignore file from CWD, so a run with `scan-path: sub/` must
        # clean both. Expressing it as a root — rather than the `rm -f ./…` this
        # replaces — is what lets the POST-CONDITION cover the same two places the
        # strip does. With the `rm` form the post-condition swept only SCAN_PATH,
        # so a root survivor could not be observed at all.
        # COVERAGE, NOT JUST SAFETY. The two checks above validate that SCAN_PATH is
        # safe to hand to `find`; neither constrains what gets SCANNED. `scan-path` is
        # caller-supplied, and on `on: pull_request` the caller's workflow file comes
        # from the PR HEAD — the same access level D23 assumes throughout. So
        # `scan-path: docs` is an existing directory with no leading `-` that passes
        # both checks, scans a code-free tree, exits 0, writes a valid SARIF with no
        # results, and the gate goes GREEN. That is bit-for-bit the outcome D26 closes
        # for `config` — the same bypass through a second door, and only one was shut.
        #
        # Costs nothing: `.` is the input's default and what every shipped caller
        # passes. A repo that genuinely needs a narrower scan asks canon for a
        # gate-side input, which is the rule restated — THE GATE decides coverage.
        case "$SCAN_PATH" in
          .) ;;
          *) echo "::error::sast-scan: scan-path must be the repo root '.'; got '${sp_safe}'. A PR-chosen subtree is a COVERAGE choice — an existing directory containing no code exits 0 with a valid empty SARIF and the gate goes green having scanned nothing (D26/§4.3i)."; exit 1 ;;
        esac
        strip_roots=("$SCAN_PATH")
        if [ "$SCAN_PATH" != "." ]; then strip_roots+=("."); fi
        d23_scan() {
          # $@ = the trailing find action, applied IDENTICALLY to strip and
          # post-condition, so the two can never cover different sets (#423's shape).
          d23_rc=0
          find "${strip_roots[@]}" \( -type f -o -type l \) \
               \( -name '.semgrepignore' -o -name '.semgreprc' \) "$@" || d23_rc=$?
          return "$d23_rc"
        }

        # `mktemp` under `set -e` as a BARE assignment aborts the step before any
        # ::error:: — the very shape `|| fst=$?` exists to prevent, twenty lines down.
        ferr="$(mktemp)" || { echo "::error::sast-scan: D23 could not allocate a temp file — refusing to scan rather than skip the check."; exit 1; }

        # D23 IS A GATE, NOT A BEST EFFORT. The `|| true` keeps a partial failure
        # from aborting the step, so the POST-CONDITION is what actually enforces
        # it. The strip's stderr is APPENDED to $ferr rather than discarded — with
        # `2>/dev/null` the delete-failure reason ("Permission denied") is destroyed
        # and the refusal then reports an EMPTY find_stderr exactly when it mattered.
        #
        # The strip's `-print` carries PR-CONTROLLED PATHS: newlines are legal in
        # git paths and the runner parses EVERY output line for `::command::`, so an
        # unfolded path could forge `::stop-commands::` and suppress the ::error::
        # below. Capture, fold, then report.
        stripped="$(d23_scan -print -delete 2>>"$ferr" || true)"
        if [ -n "$stripped" ]; then
          stripped_safe="$(printf '%s' "$stripped" | tr '\n\r' '??' | cut -c1-500)"
          # A repo that committed one of these ON PURPOSE gets it deleted from the
          # workspace. Say so, and say where the exclusion belongs instead — silence
          # here is how a maintainer concludes the scanner is broken.
          echo "::warning::sast-scan: D23 removed PR-supplied scanner config before scanning — it was NOT honoured. Express a real exclusion gate-side (the ruleset), never in a repo file (REPO_STANDARDS §4.3e). Removed: ${stripped_safe}"
          summary "⚠️ D23 removed PR-supplied scanner config — NOT honoured: ${stripped_safe}"
        fi

        # CI-0033 / §27.1: decide on captured OUTPUT, never on a pipeline's exit
        # status. This was `find … -print -quit | grep -q .`, and it was a
        # REPRODUCED fail-open — not by EPIPE (one write, so grep cannot leave
        # first) but by find's OWN status: `-quit` returns non-zero when a
        # traversal error is recorded before it quits, `pipefail` takes that over
        # grep's 0, and the `if` reads false while the survivor sits on stdout.
        # Whether the error is reached first depends on readdir order, which is
        # neither alphabetical nor under your control — observed both ways on the
        # same directory contents, so it is a live fail-open, not a certainty.
        #
        # `|| fst=$?` is load-bearing: a bare assignment takes the substitution's
        # status and `set -e` (:82) would abort HERE, before the ::error:: below
        # — a red step with no stated cause.
        fst=0
        survivor="$(d23_scan -print -quit 2>>"$ferr")" || fst=$?
        if [ -n "$survivor" ] || [ "$fst" -ne 0 ]; then
          # Newlines are legal in git paths and GitHub parses EVERY output line
          # for `::command::`, so an unsanitised path here lets a PR forge a
          # workflow command. Fold the path to one line before interpolating.
          survivor_safe="$(printf '%s' "$survivor" | tr '\n\r' '??')"
          find_err="$(tr '\n\r' '  ' < "$ferr" | cut -c1-300)"
          rm -f "$ferr"
          echo "::error::sast-scan: could not certify the tree clean of PR-supplied semgrep ignore/rc files — refusing to scan rather than accept attacker-controlled coverage (D23). survivor='${survivor_safe}' find_rc=${fst} find_stderr='${find_err}'"
          exit 1
        fi
        rm -f "$ferr"

        # Static AST scan. --metrics off = NO telemetry. Explicit --config (registry
        # ruleset), NEVER repo-local auto-discovery → a PR cannot inject rules. semgrep
        # exits 0 on a successful scan (findings or not); non-zero = a tool/infra error.
        rc=0
        timeout 1200 "$VENV/bin/semgrep" scan --config "$CONFIG" --metrics off \
          --sarif --output "$SARIF" "$SCAN_PATH" || rc=$?
        if [ "$rc" -ne 0 ]; then
          echo "::error::sast-scan: semgrep exited $rc — infrastructure/tool error (e.g. ruleset fetch failed, bad config), NOT a finding. Re-run."; exit 1
        fi

        # rc==0 must mean a REAL scan happened. A missing or unparseable SARIF (partial
        # write, OOM, disk pressure on the --rm container) is an infra error — fail loud,
        # NEVER treat a broken report as "no findings" (the silent green this gate exists
        # to prevent).
        if [ ! -s "$SARIF" ]; then
          echo "::error::sast-scan: semgrep exited 0 but produced no SARIF — infrastructure error, not a clean scan. Re-run."; exit 1
        fi
        if ! n=$(jq -e '[.runs[].results[]] | length' "$SARIF" 2>/dev/null); then
          echo "::error::sast-scan: $SARIF is unparseable — infrastructure error, not a clean scan. Re-run."; exit 1
        fi
        if [ "$n" -gt 0 ]; then
          echo "::warning::sast-scan: $n SAST finding(s) — see $SARIF / the Security tab."
          summary "❌ $n SAST finding(s) (semgrep, config: $CONFIG)."
          if [ "$FAIL" = "true" ]; then
            echo "::error::sast-scan: failing the gate (fail-on-findings: true)."; exit 1
          fi
          echo "::notice::sast-scan: report-only (fail-on-findings: false) — not blocking. Flip fail-on-findings to gate."
        else
          echo "::notice::sast-scan: no SAST findings for config '$CONFIG'."
          summary "clean — no SAST findings (config: $CONFIG)."
        fi

    # PLAN-014 §4a Phase 4 — the one safe autofix path: semgrep --autofix is
    # DETERMINISTIC and rule-provided, no model. It rewrites files in the
    # EPHEMERAL workspace, which is discarded after the job; nothing is pushed.
    #
    # DEFENSE (D-summary-injection): the PR-controlled diff renders as a 4-space
    # INDENTED block, never a ``` fence. A diff context line that is exactly ```
    # would close a fence early and let the rest render as forged job-summary
    # markdown. An indented block has no closing delimiter to break out of.
    #
    # Opt-in, default off, and `== 'true'` because a composite action's inputs
    # are STRINGS — a bare `${{ inputs.autofix-preview }}` is truthy for the
    # literal 'false'.
    # A PREVIEW MUST NEVER FAIL THE SCAN GATE, and `exit 0` alone does NOT
    # deliver that. `git diff | head -n 400` gives git SIGPIPE (141) once head
    # closes the pipe; `pipefail` adopts it and `set -e` aborts the step BEFORE
    # `exit 0` is reached. MEASURED: a small producer finishes first and hides
    # this (`seq 1 1000` → 0), a real diff does not (`seq 1 5000000` → 141).
    # v2 used `set -uo pipefail` — deliberately NO `-e` — plus
    # `continue-on-error`. The attribute is undocumented inside a composite
    # action (§3.2a), so v2's `set` line is what carries the guarantee here.
    - name: semgrep autofix preview (deterministic; NO push; best-effort)
      if: ${{ inputs.autofix-preview == 'true' }}
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        SCAN_PATH: ${{ inputs.scan-path }}
      run: |
        # NEVER FAIL THE GATE — see the step comment: `-e` is omitted on purpose.
        set -uo pipefail
        VENV="$RUNNER_TEMP/sgvenv"
        timeout 1200 "$VENV/bin/semgrep" scan --config "$CONFIG" --metrics off --autofix "$SCAN_PATH" >/dev/null 2>&1 || true
        if git diff --quiet 2>/dev/null; then
          echo "::notice::sast-scan autofix-preview: no auto-fixable findings (no rule provided a fix)."
          echo "sast-scan autofix-preview: no auto-fixable findings." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
        else
          echo "::notice::sast-scan autofix-preview: deterministic fixes available — see the job summary (NOT applied)."
          # Render the (PR-controlled) diff as a 4-space INDENTED code block, NOT a ```
          # fence: a diff context line that is exactly ``` would close a fence early and
          # let the rest render as forged summary markdown. An indented block has no
          # closing delimiter to break out of, so PR content cannot spoof the summary.
          {
            echo "### sast-scan — semgrep autofix preview (deterministic; NOT applied, nothing pushed)"
            echo "Download-and-apply this patch, or let the armed autofix App push it. Truncated to 400 lines:"
            echo ""
            git diff | head -n 400 | sed 's/^/    /'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          git checkout -- . 2>/dev/null || true   # restore workspace (defensive; job is ephemeral)
        fi
        # A PREVIEW MUST NEVER FAIL THE SCAN GATE. v2 got this from
        # `continue-on-error`; here it is explicit, because that attribute is
        # unverified inside a composite action.
        exit 0
