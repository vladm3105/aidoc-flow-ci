# links composite action — v3 packaging of the ci/v2.x `links` reusable.
# Both run bodies are VERBATIM PORTS (PLAN-025 §1).
#
# CHECKOUT IS THE CALLER'S JOB (§3.2).
#
# DEFENSES CARRIED (PLAN-025 §2 — do not remove):
#   D5   actions/* SHA-pinned.
#   D20  The lychee tarball is SHA-256 verified BEFORE it is unpacked and run.
#        A release asset is mutable state on infrastructure we do not control;
#        without this, a substituted tarball executes on the runner.
#   D21  lychee is installed as a BINARY, never via the marketplace action —
#        canon may only `uses:` actions/*, github/*, vladm3105/*, and a
#        non-allowlisted action is a run-init startup_failure with a web-UI-only
#        message actionlint cannot catch. This is why the body is hand-rolled.
#   D38  The **musl** static build specifically: the gnu build needs GLIBC 2.38+
#        and fails on the older Debian ephemeral runners.
#   D15  `set -euo pipefail` in every run.
#   Injection: consumer inputs go through `env:`, never source interpolation, so
#        a hostile `paths`/`config-file` cannot inject a `${{ }}` expression.
#        `--` stops a caller-supplied PATHS from being parsed as lychee options.
#
# TOKEN IS AN INPUT, NOT A SECRET REFERENCE (§3.2a). The `secrets` context is
# unavailable inside a composite action; the caller must pass
# `github-token: ${{ secrets.GITHUB_TOKEN }}`. Without it lychee hits github.com
# anonymous rate limits and reports false dead links.
name: links
description: Check links with lychee (musl static binary, checksum-verified).

inputs:
  paths:
    description: 'Space-separated paths to check. Word-split by design.'
    required: false
    default: '.'
  mode:
    description: '"internal" adds --offline (no network); anything else checks external links too.'
    required: false
    default: 'external'
  config-file:
    description: 'Path to a lychee.toml. Applied only if the file exists.'
    required: false
    default: 'lychee.toml'
  fail-on-error:
    description: 'Fail the step on broken links. Scheduled/external runs typically set false.'
    required: false
    default: 'true'
  github-token:
    description: 'Token for github.com rate limits. The secrets context is not available inside a composite action, so the CALLER must pass this.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # PLAN-025 §3.2: verify the precondition, fail loudly if unmet. lychee over
    # an absent tree reports zero links checked and exits 0 — a green check that
    # inspected nothing.
    - name: Verify precondition — a checked-out tree
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -e .git ]; then
          echo "::error::links action: no checkout detected. The CALLER must check out before invoking this action (PLAN-025 §3.2)."
          exit 1
        fi

    - name: Install lychee (musl static binary)
      shell: bash
      env:
        LYCHEE_VERSION: "0.24.2"
        LYCHEE_SHA256: "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5"
      run: |
        set -euo pipefail
        curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-musl.tar.gz" -o /tmp/lychee.tgz
        echo "${LYCHEE_SHA256}  /tmp/lychee.tgz" | sha256sum -c -
        tar -xzf /tmp/lychee.tgz -C /tmp
        BIN_DIR="$RUNNER_TEMP/bin"
        mkdir -p "$BIN_DIR"
        install -m 0755 /tmp/lychee-x86_64-unknown-linux-musl/lychee "$BIN_DIR/lychee"
        echo "$BIN_DIR" >> "$GITHUB_PATH"
        "$BIN_DIR/lychee" --version

    - name: Run lychee
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        CONFIG: ${{ inputs.config-file }}
        PATHS: ${{ inputs.paths }}
        FAIL: ${{ inputs.fail-on-error }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        args=(--no-progress --cache --max-cache-age 1d)
        [ -f "${CONFIG}" ] && args+=(--config "${CONFIG}")
        [ "${MODE}" = "internal" ] && args+=(--offline)
        read -r -a path_args <<< "$PATHS"
        [ "${#path_args[@]}" -gt 0 ] || { echo "::error::paths input is empty"; exit 1; }
        set +e
        # `--` stops a caller-supplied PATHS value from being parsed as lychee
        # options (defense-in-depth against argument injection).
        lychee "${args[@]}" -- "${path_args[@]}"
        rc=$?
        # fail-on-error=false (external/scheduled mode) never fails the job.
        [ "${FAIL}" = "true" ] || exit 0
        exit "${rc}"
