# CANON: aidoc-flow-ci pre_push_check v2 (idempotency marker per PLAN-002 §5.2)
#
# Canonical pre-commit fragment wiring the canon pre_push_check.sh hook.
# `install/install.sh` merges this block into a consumer's
# `.pre-commit-config.yaml` idempotently (marker comment above triggers
# no-op re-installation).
#
# TWO surfaces are wired:
#   (a) `default_install_hook_types: [pre-commit, pre-push]` at the root —
#       ensures `pre-commit install` also sets up the pre-push git hook.
#       install.sh upgrades the value in-place if consumer has only
#       [pre-commit]; leaves alone if already [pre-commit, pre-push].
#   (b) The pre-push local hook below, invoking scripts/pre_push_check.sh.
#
# Consumers that need repo-specific extras (e.g., verified-planning
# `check_plan.py`) point this entry at `scripts/pre_push_check_<repo>.sh`
# WRAPPER instead — wrapper sources canon + adds its own checks. See
# PLAN-002 §4.8 for the operations wrapper reference design.

default_install_hook_types:
- pre-commit
- pre-push

repos:
# Wave-0 self-adoption of the canon fragment's commit-stage hooks (PLAN-018 F3),
# per the canon-dogfoods-its-own-canon rule in CLAUDE.md. Originally hand-added
# because an already-marked config was unreachable by the merge; FT-32 fixed that
# (the marker above carries canon's CURRENT vN, so this file is in steady state
# and install.sh no-ops on it for the right reason rather than the broken one).
# Keep the marker in step with install/templates/pre-commit-hook-block.yaml.
- repo: https://github.com/pre-commit/pre-commit-hooks
  # SHA-pinned, not tag-pinned. A git tag is attacker-mutable state on
  # infrastructure this workspace does not control, and pre-commit `pip install`s
  # the cloned tree — so the upstream build backend runs arbitrary code at
  # INSTALL time, on developer machines and on the ephemeral self-hosted CI pool.
  # Those runners are cold every run (no cache step in the reusable), so they
  # re-resolve the ref on every execution: a moved tag would reach the whole
  # fleet within one CI cycle. Canon SHA-pins every `uses:` for exactly this
  # reason (REPO_STANDARDS §4.3); a mutable rev here would be strictly weaker
  # than everything else canon does, in the file that propagates furthest.
  # Format is `pre-commit autoupdate --freeze` output, so bumps round-trip.
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: local
  hooks:
  - id: aidoc-flow-pre-push
    name: aidoc-flow canon pre-push validation + OPS-0069 audit-trail check
    entry: scripts/pre_push_check.sh
    language: script
    stages:
    - pre-push
    pass_filenames: false
    always_run: true
  # Repo-specific extra (NOT part of the consumer canon fragment): keep the
  # docs' install references in sync with the single-source VERSION file so
  # they cannot silently go stale across release cuts (PLAN-004 BL-4).
  - id: sync-version-refs
    name: docs install refs match VERSION (PLAN-004 BL-4)
    entry: scripts/sync-version-refs.sh --check
    language: script
    # `always_run`, NOT a `files:` filter. The hook is `pass_filenames: false`, so
    # the filter never decided WHAT was checked (the script always checks every
    # TARGETS entry) — only WHETHER the hook ran at all. It listed 6 of the 14
    # static targets and had drifted behind `TARGETS`, so a commit touching only
    # e.g. `docs/MIGRATION_v2.0.0.md` — the file CI-0024 is about — skipped the
    # hook locally and the author first learned at PR time. CI was never affected
    # (`pre-commit run --all-files`). A regex duplicating TARGETS is a second list
    # to keep in step; always_run removes it. (#323.)
    always_run: true
    pass_filenames: false
  # Repo-specific extra (NOT part of the consumer canon fragment): give
  # `check_plan.py` a reader. 23 plans carry a Claim ledger and NOTHING in
  # this repo invoked the gate that verifies them, so PLAN-023's ledger
  # asserted the presence of a symbol whose absence PLAN-025 P8 had made the
  # tested invariant — for weeks, silently. Same defect class as #355
  # (`governance_check` has no CI reader): a gate that exists, is correct, and
  # is never invoked reports nothing and looks like coverage. (#469.)
  #
  # ADVISORY at this pin — it reports failing rows and exits 0. 79 rows across
  # 11 gated plans fail today; blocking on day one would red every
  # plan-touching push, which is how a hook gets `--no-verify`d and then
  # ignored. Set LEDGER_GATE_BLOCKING=1 to enforce once the gated set is clean.
  #
  # `--ledger-only` because canon's pre_push_check.sh is already wired above;
  # without it the canon checks would run twice on every push.
  - id: claim-ledger-gate
    name: Claim ledgers verify against cited sources (#469, advisory)
    entry: scripts/pre_push_check_ci.sh --ledger-only
    language: script
    stages:
    - pre-push
    # `always_run`, NOT a `files:` filter on plans/*.md. Editing a CITED file
    # breaks the ledgers of every OTHER plan that cites it, so a filter keyed
    # to the plan files would miss exactly the case that bites — a code or doc
    # commit that touches no plan at all and invalidates several.
    always_run: true
    pass_filenames: false
