# Caller template for aidoc-flow-ci's reusable pre-commit workflow.
# PRIVATE variant → self-hosted ci-runner/single-use pool (OPS-0049; never
# ubuntu-latest). PUBLIC consumers use pre-commit.yml. Generated to match the wizard's
# runner_labels injection so install.sh --update resolves a labeled file for
# private repos instead of the label-less generic (which would revert to
# ubuntu-latest and queue forever).
#
#
# Single template (works for both PRIVATE + PUBLIC). The reusable
# workflow uses ubuntu-latest by default. PRIVATE consumers per
# OPS-0049 may override runner_labels to '["self-hosted", "ci-runner", "single-use"]'.
#
# Requires .pre-commit-config.yaml in the consumer repo root. The
# workflow runs all hooks against all files via
# `pre-commit run --all-files`.

name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # CI-0025 / REPO_STANDARDS §23: ALLOWLIST of the code-changing events.
  # This caller feeds a REQUIRED context. Every event here other than a push or a
  # code-changing PR action fires at the CURRENT head SHA, and a cancelled required
  # check is not success — it is retained alongside any later success from a
  # separate run, so the rollup stays FAILURE and the PR is --admin-only. A label
  # write (audit-trail's documented `skip-audit-trail` hatch) or a reopen would do
  # it. Expressed as `==` so an empty `github` context yields false and cancels
  # nothing; a `!=` denylist would cancel everything in that degraded state.
  cancel-in-progress: >-
    ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
          && contains(fromJSON('["opened","synchronize"]'), github.event.action)) }}
jobs:
  call:
    uses: vladm3105/aidoc-flow-ci/.github/workflows/pre-commit.yml@ci/v2.15.0
    with:
      runner_labels: '["self-hosted", "ci-runner", "single-use"]'
      python-version: '3.12'
      # Override example:
      # extra-deps: '-r tests/conformance/requirements.txt'
