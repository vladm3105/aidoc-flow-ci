# Caller template for aidoc-flow-ci's reusable codeql workflow.
#
# Triggers per GitHub's recommended pattern: push + PR to default
# branch + weekly cron + workflow_dispatch. Cron is staggered (Mon
# 14:20 UTC = ~10:20 EST / 7:20 PST) to avoid contention with other
# weekly jobs.
#
# Adjust the `languages` input to match your repo. Default ["actions"]
# scans the workflows themselves — every consumer benefits. Add other
# languages as appropriate (e.g., '["actions","python","javascript-typescript"]').

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call:
    uses: vladm3105/aidoc-flow-ci/.github/workflows/codeql.yml@ci/v3.0.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["actions"]'
      # PUBLIC variant — runs on the reusable's `ubuntu-latest` default, which is
      # correct here: canon's public repos have hosted minutes, and codeql is
      # widely tested on ubuntu. PRIVATE consumers do NOT hand-edit this: the
      # installer resolves `workflows/codeql-private.yml` for them, which carries
      # `runner_labels: '["self-hosted", "ci", "ephemeral"]'`. This used to be a
      # commented-out override, and a commented override is not delivered by
      # `--add-surface` — the private adopter got the hanging default instead.
