# PROTECTED caller — uniform on PUBLIC and PRIVATE repos (PLAN-013).
# Runs on the ephemeral self-hosted pool regardless of visibility:
# there is no `-public`/`-private` split, so a repo visibility flip is a no-op.
# Safe on public repos because forks are never trusted (see `.github/ai-review/
# config.json` trust gate) → a fork PR reaches only the no-PR-code trust job on
# the isolated pool; the heavy review job runs only for trusted, non-fork authors.
#
# Secrets required (consumer adds to repo secrets):
#   APP_REVIEWER_1_ID + APP_REVIEWER_1_KEY  reviewer App credentials
#   LLM_URL                                  shared ai-reviewer proxy base URL
#                                            (normally .../v1)
#   LLM_API_KEY                              this repo's VIRTUAL key to that
#                                            proxy — NOT a model-provider API
#                                            key (one key, all steps — review
#                                            AND autofix)
#
# WHAT `LLM_API_KEY` IS DEPENDS ON WHAT `LLM_URL` POINTS AT.
#
# In the aidoc-flow deployment the ai-reviewer is a SHARED gateway, and
# `LLM_API_KEY` is the identity this repo presents to it: scoped to one model
# alias, budget-capped, tagged with this repo, revocable on its own. The
# model-provider credential then lives inside the gateway and never reaches a
# repository, so a leak exposes this repo's quota on one alias. Mint this
# repo's key with `install/set-llm-secrets.sh --mint` (LiteLLM management API);
# do not paste one key across repos.
#
# If you point `LLM_URL` DIRECTLY at a model provider — supported; the client
# is endpoint-agnostic — then `LLM_API_KEY` IS a provider credential and a leak
# exposes your provider account. The per-repo scoping above does not apply.
#
# DEPRECATED — do not PROVISION on a new consumer: `APP_AUTOFIX_ID`,
# `APP_AUTOFIX_KEY`, `AI_REVIEW_TOKEN`. They stay DECLARED by the reusable and
# stay FORWARDED by this template; only the guidance to set them is withdrawn.
#   * autofix is opt-in and default-off — without its App creds the job
#     self-skips with a notice. No consumer holds them.
#   * AI_REVIEW_TOKEN is a legacy PAT rung between the reviewer App token and
#     GITHUB_TOKEN. It is NOT dead: `GITHUB_TOKEN` is sufficient only where the
#     caller repo IS the `trust_config_repo`. Elsewhere, if the App token cannot
#     be minted or lacks `contents: read` on a PRIVATE trust-config repo, this
#     PAT is the only remaining way the trust gate can read its config. If you
#     have it set, KEEP it; if you do not, install the reviewer App on the
#     trust-config repo with `contents: read` instead.
#
# `pull_request_target` (not `pull_request`) is required so the trust gate has
# write-capable credentials + secrets; the heavy job runs only for trusted
# authors per `.github/ai-review/config.json`.
name: ai-review
on:
  pull_request_target:
    # FT-43: ready_for_review + converted_to_draft so a draft→ready transition
    # triggers a real review (and a ready→draft still gets a real review while unarmed — #331 removed the
    # fail-closed step that used to intercept it),
    # rather than a code-changed-while-draft PR going straight to merge un-reviewed.
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted]

# Caller-level permissions set the ceiling for the reusable. The canon repo
# default is `read` (install/templates/actions-permissions.json), and the
# reusable requests contents/pull-requests/issues: write — so WITHOUT this
# block the reusable exceeds the caller grant and fails at load
# (startup_failure, zero jobs) on any consumer under the read default. Scopes
# match the reusable's own declaration (ai-review.yml). Safe under
# pull_request_target because the reusable is diff-only on the REVIEW path: the
# heavy review job fetches the diff via curl and never `actions/checkout`s the PR
# head; the sole review-path checkout is the trust gate reading the trust-config
# repo. (Exception — the DEFAULT-OFF autofix job DOES check out the PR head to
# apply a fix, but with a read-only token, `persist-credentials: false`, and it
# never EXECUTES PR code (only `git apply` + a canon-pinned client); it stays
# inert until the founder enables it — CI-0009.) Keep the review path diff-only
# if the reusable is ever edited.
permissions:
  contents: write        # reusable auto-merge fallback (gh pr merge via GITHUB_TOKEN)
  pull-requests: write   # trust-gate + verdict comments + label set
  issues: write          # gh api label create/apply paths
jobs:
  call:
    uses: vladm3105/aidoc-flow-ci/.github/workflows/ai-review.yml@ci/v4.0.0
    with:
      # Model selection is CONFIG-DRIVEN: the reusable reads `litellm.model`
      # from the trusted .github/ai-review/config.json. Uncomment to override:
      # model: ai-reviewer
      runner_labels_routine: '["self-hosted", "ci", "ephemeral"]'
      runner_labels_review: '["self-hosted", "ci", "ephemeral"]'
      # HTTP proxies require explicit opt-in. Required by the URL SCHEME, NOT by
      # repo visibility — if LLM_URL starts `http://`, uncomment this,
      # public repo or not. On the shared self-hosted pool the proxy is the
      # Docker bridge gateway (http://172.17.0.1:4001/v1 — plain HTTP), so this
      # applies there too. NB: LLM_URL must NOT be 127.0.0.1/localhost;
      # jobs run inside a container, so loopback is the container itself.
      # (CI-0017.)
      # llm_allow_insecure_http: true
      # External adopters: point the trust config at YOUR ops/config repo
      # (holds `.github/ai-review/config.json`). Defaults to
      # vladm3105/aidoc-flow-operations@main.
      # trust_config_repo: your-org/your-ops-repo
      # trust_config_ref: main
      # NOTE: this override does NOT yet reach the composition gate, which reads
      # the consumer repo's own .github/ai-review/config.json@main (FT-6).
    # FT-42: explicit least-privilege map (was `secrets: inherit`). Only the
    # secrets this reusable declares are forwarded; an unset one passes empty and
    # the matching flow self-skips (reusable inputs are all `required: false`).
    secrets:
      APP_REVIEWER_1_ID: ${{ secrets.APP_REVIEWER_1_ID }}
      APP_REVIEWER_1_KEY: ${{ secrets.APP_REVIEWER_1_KEY }}
      # DEPRECATED — do not PROVISION these on a new consumer. They are still
      # FORWARDED, deliberately: forwarding an unset secret is an empty string
      # and costs nothing, while NOT forwarding one a repo actually has removes
      # a working fallback. `AI_REVIEW_TOKEN` is the middle rung of
      # App token -> AI_REVIEW_TOKEN -> GITHUB_TOKEN, and GITHUB_TOKEN cannot
      # read a PRIVATE trust_config_repo from a different repo — so for every
      # consumer that is not the trust-config repo itself, dropping this line
      # turns an App-token failure into a FAILED trust job, a SKIPPED ai-review,
      # and a required check that reports GREEN with no review performed.
      APP_AUTOFIX_ID: ${{ secrets.APP_AUTOFIX_ID }}
      APP_AUTOFIX_KEY: ${{ secrets.APP_AUTOFIX_KEY }}
      AI_REVIEW_TOKEN: ${{ secrets.AI_REVIEW_TOKEN }}
      # UNIFIED NAMES — provision these two on the repo.
      LLM_URL: ${{ secrets.LLM_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      # ci/v4.0.0 (CI-0051): the LITELLM_BASE_URL / LITELLM_REVIEW_API_KEY /
      # LITELLM_FIX_API_KEY forwards were REMOVED — the reusable no longer
      # DECLARES them. If your caller still lists those three, DELETE the lines
      # in the SAME commit as the repin: GitHub rejects an explicit `secrets:`
      # map naming a secret the callee does not declare, and the workflow fails
      # to LOAD (startup_failure, zero jobs, no logs). Provisioning secrets does
      # not help — the map itself is invalid. See docs/MIGRATION_v4.0.0.md §3.
