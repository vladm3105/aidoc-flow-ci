# scanners — v3 caller consolidating the three SELF-HOSTED security scanners
# into ONE job (PLAN-025 P3a).
#
# ── WHY `secret-scan` IS NOT HERE (P3a — this is the disqualifier) ───────────
# `secret-scan` is `ubuntu-latest` and deliberately FORK-VISIBLE: it must see a
# fork PR's code. These three are self-hosted and deliberately fork-GUARDED.
# One job has one `runs-on` and one `if:`, so merging them would force a choice,
# and either answer is wrong:
#
#   - Take the pool + fork guard → the job reports `skipped` on every fork PR,
#     and **a skipped job SATISFIES a required context**. `secret-scan` would go
#     green having never run: a green required check that scanned nothing, which
#     is the D22 class this plan exists to prevent.
#   - Stay on ubuntu-latest → the three lose their uniform-protected posture and
#     private consumers pay GitHub-hosted minutes (OPS-0049).
#
# So `secret-scan` keeps its own job and its existing `call / gitleaks` context —
# no P7 migration for it at all.
#
# ── D27: THE FORK GUARD IS JOB-LEVEL, AND THAT IS LOAD-BEARING ───────────────
# It CANNOT move into the composite actions. A step-level skip runs AFTER the
# job has already checked the fork's code out, which turns an admission guard
# into a no-op. All three v2 reusables carry the identical condition, so one
# job-level `if:` serves all three exactly.
#
# ── D4: THE JOB ID IS THE REQUIRED STATUS CONTEXT ────────────────────────────
# Emits the BARE context `scanners` — a plain job has no `<jobkey> / ` prefix
# (that shape comes only from a reusable call). Migrate add-new → observe green
# on LIVE protection AND rulesets → remove old → delete old callers (D19, D40).
name: scanners

on:
  pull_request:
  # POST-MERGE COVERAGE. Every v2 caller these replace fired on both
  # `pull_request` and `push: main`, and dropping it was silent. Two losses:
  # a merge that lands broken (admin merge, merge-queue skew) is never caught,
  # and — the one that matters for the scanners — Code Scanning alerts are
  # anchored to the DEFAULT BRANCH, so with no push-to-main run the SARIF
  # baselines never refresh: fixed alerts stay open forever and new ones never
  # appear outside PR context. It also makes the `push`/`workflow_dispatch` arms
  # of the D3 concurrency allowlist below reachable rather than dead code.
  push:
    branches: [main]

permissions:
  contents: read
  # D35: needed by the SARIF uploads below. This is the UNION of the three
  # scanners' v2 grants — §3.2a records that consolidating weakens D9's
  # per-callee ceiling, and accepts it here because all three already share one
  # trust boundary, one pool and one event.
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # D3 / CI-0025 / §23: an ALLOWLIST, never a blanket cancel. The three v2
  # reusables each carried `cancel-in-progress: true`, which was safe while none
  # of them fed a required context. This job DOES, so the allowlist applies:
  # a cancelled required check is not success, and the rollup stays FAILURE.
  cancel-in-progress: >-
    ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
          && contains(fromJSON('["opened","synchronize"]'), github.event.action)) }}

jobs:
  scanners:
    name: scanners
    # D27 — see the header. Identical across all three v2 reusables.
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    runs-on: ["self-hosted", "ci-runner", "single-use"]
    # §3.2b: the SUM of the absorbed budgets (dep-scan 15 + sast 20 + trivy 15)
    # PLUS headroom. The sum alone is exactly what the `timeout N` wrappers
    # inside the three actions already total (900+1200+900s = 50m), so a job
    # budget of 50 lets the job-level kill pre-empt the inner timeouts — losing
    # both their "infrastructure error, re-run" diagnostics AND the `if: always()`
    # verdict step, which a job-level timeout cancels. The extra 10 covers the
    # checkout, a `python3 -m venv` + pip install, and three checksum-verified
    # binary downloads, none of which the sum accounts for.
    timeout-minutes: 60
    steps:
      - name: Checkout (data-only; no persisted creds)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # THE GATE DECIDES WHAT IS UPLOADED, NOT THE SCANNED PR — the same rule as
      # D23, applied to the report instead of the coverage.
      #
      # The three SARIF paths below live in the CHECKED-OUT TREE, and each upload
      # is gated on `hashFiles(...)`, which asks only whether a file exists. A PR
      # can commit `semgrep.sarif` at the repo root, so the gate cannot tell the
      # scanner's report from the PR's. That is not hypothetical while #349 is
      # open: "the scanner failed and wrote nothing" is the expected state, so the
      # committed file is the ONLY candidate. It then rides the `push: main` run
      # into `upload-sarif` under `security-events: write`, and because Code
      # Scanning keys an analysis by `category`, an empty `results` array REPLACES
      # the previous analysis — every open alert in that category is auto-resolved
      # as fixed. The verdict step still reds the build; the alerts are already
      # gone.
      #
      # Purge first, then refuse if anything survived. `hashFiles` is left as the
      # emptiness check it is good at, now that what it inspects can only have
      # been written by a scanner in this job.
      - name: Purge PR-supplied SARIF before scanning (gate-decides-the-report)
        shell: bash
        run: |
          set -euo pipefail
          # `|| true` IS THE GATE'S DESIGN, not sloppiness — same shape as D23 in
          # actions/sast-scan. A bare `rm -f` aborts under `set -e` when the path
          # is a DIRECTORY (`rm: cannot remove: Is a directory`), and it aborts
          # BEFORE the ::error:: below, producing a red step with no stated cause.
          # Measured while writing this step. The purge is best-effort; the
          # post-condition is what enforces.
          rm -f ./osv.sarif ./trivy.sarif ./semgrep.sarif 2>/dev/null || true
          # NO `-type` FILTER, deliberately. `-type f -o -type l` was the first
          # draft and it cannot see a DIRECTORY named `osv.sarif` — precisely the
          # survivor `rm -f` is unable to clear, so the one case the purge fails
          # to handle was the one case the check could not detect.
          #
          # CI-0033 / §27.1 — decide on captured OUTPUT, never on a pipeline's
          # exit status. `find … | grep -q .` inverts two ways here: SIGPIPE from
          # the early-exiting reader, and find's own non-zero on a traversal
          # error while the match is already on stdout. Both fail OPEN.
          # `|| fst=$?` is load-bearing: a bare assignment adopts the
          # substitution's status and `set -e` would abort before the ::error::.
          fst=0
          survivor="$(find . -maxdepth 1 \
            \( -name 'osv.sarif' -o -name 'trivy.sarif' -o -name 'semgrep.sarif' \) -print -quit)" || fst=$?
          if [ -n "$survivor" ] || [ "$fst" -ne 0 ]; then
            # Newlines are legal in git paths and GitHub parses every output line
            # for `::command::`, so fold before interpolating.
            echo "::error::scanners: a PR-supplied SARIF survived the purge — refusing to scan rather than let it be uploaded as a scanner's report. survivor='$(printf '%s' "$survivor" | tr '\n\r' '??')' find_rc=${fst}"
            exit 1
          fi

      # §3.2c COLLECT-THEN-FAIL. Without it the first blocking scanner prevents
      # the other two from running or uploading SARIF, and under PLAN-014 Phase 5
      # (fail-on-findings → true) that becomes the normal case.
      # sync-version-refs:ignore-start
      # ^ FORWARD REFERENCE, not a stale pin. `ci/v3.0.0` does not exist yet, and
      # `actions/` does not exist at ci/v2.16.0 — the rewriter's remedy #1 would
      # point these at a tag where the action is absent. REMOVE THESE MARKERS AT
      # THE v3.0.0 TAG CUT. (FT-21 chicken-and-egg shape.)
      - name: dep-scan (SCA — osv-scanner)
        id: depscan
        continue-on-error: true
        uses: vladm3105/aidoc-flow-ci/actions/dep-scan@ci/v3.0.0
        with:
          scan-path: .
          fail-on-findings: 'false'
          expect-manifests: 'true'
          sarif-path: osv.sarif

      - name: trivy-scan (IaC/misconfig)
        id: trivy
        continue-on-error: true
        uses: vladm3105/aidoc-flow-ci/actions/trivy-scan@ci/v3.0.0
        with:
          scan-path: .
          fail-on-findings: 'false'
          sarif-path: trivy.sarif

      - name: sast-scan (semgrep)
        id: sast
        continue-on-error: true
        uses: vladm3105/aidoc-flow-ci/actions/sast-scan@ci/v3.0.0
        with:
          scan-path: .
          config: p/default
          fail-on-findings: 'false'
          autofix-preview: 'false'
          sarif-path: semgrep.sarif
      # sync-version-refs:ignore-end

      # D35: best-effort by construction. A private repo without GHAS returns
      # 403 "code scanning not enabled" — the SARIF surfacing is a nice-to-have;
      # the fail-on-findings GATE is the compliance control, and a failed upload
      # must NEVER fail the job. `continue-on-error` is supported HERE because
      # these are job steps (§3.2a defers it only INSIDE a composite action).
      # PER-FILE, PER-CATEGORY. An earlier draft used `sarif_file: .`, which is
      # the checked-out PR tree — so ANY `*.sarif` a PR commits was ingested
      # under `security-events: write` (forged alerts), and one malformed file
      # rejected the whole submission, silently dropping all three scanners'
      # results. Dropping `category:` was worse: Code Scanning keys an analysis
      # by category, so a single uncategorised upload REPLACES all three, and a
      # crashed scanner's alerts get resolved as fixed. Each step is guarded by
      # its own `hashFiles`, so a scanner that produced nothing is simply skipped.
      #
      # THE FORK CLAUSE IS NOT REDUNDANT WITH THE JOB-LEVEL `if:` (D35). All
      # three v2 reusables carry it on the upload step as well
      # (`.github/workflows/dep-scan.yml:138`, `trivy-scan.yml:114`,
      # `sast-scan.yml:169`), and the v3 port dropped it from all three while
      # PLAN-025 §2 records D35 as carried. Two reasons it goes back:
      #   1. It made the job `if:` at :68 the SOLE barrier between a fork PR and
      #      three steps holding `security-events: write`. In v2 a mis-edit there
      #      still left three independent guards; here it left none.
      #   2. That job `if:` is null-permissive — `head.repo.fork != true` is TRUE
      #      when `head.repo` is null, which is what a deleted fork on a
      #      `reopened` event produces. The step clause tests `event_name` first,
      #      so it does not share that hole.
      # `tests/test_contract.sh` greps only the job-level guard, which is why
      # nothing caught the drop; an assertion for the step clause lands with this.
      - name: Upload dep-scan SARIF (best-effort)
        continue-on-error: true
        if: always() && hashFiles('osv.sarif') != '' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: osv.sarif
          category: dep-scan

      - name: Upload trivy SARIF (best-effort)
        continue-on-error: true
        if: always() && hashFiles('trivy.sarif') != '' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy.sarif
          category: trivy-scan

      - name: Upload sast SARIF (best-effort)
        continue-on-error: true
        if: always() && hashFiles('semgrep.sarif') != '' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: semgrep.sarif
          category: sast-scan

      # THE VERDICT — fails CLOSED (D6, CI-0026). Any outcome that is not exactly
      # `success` fails, including `skipped` and the empty string a step that
      # never ran produces. `skipped` matters especially: P3a establishes that a
      # skipped JOB satisfies a required context, so treating a skipped STEP as a
      # pass would launder a crashed scanner into a green gate by the same route.
      - name: verdict
        if: always()
        shell: bash
        env:
          R_DEPSCAN: ${{ steps.depscan.outcome }}
          R_TRIVY: ${{ steps.trivy.outcome }}
          R_SAST: ${{ steps.sast.outcome }}
        run: |
          set -euo pipefail
          rc=0
          for chk in DEPSCAN TRIVY SAST; do
            var="R_${chk}"; out="${!var-}"
            case "$out" in
              success) printf '  %-10s %s\n' "$chk" "pass" ;;
              failure) printf '::error::%s failed\n' "$chk"; rc=1 ;;
              *)       printf '::error::%s did not report a verdict (outcome=%s) — failing closed\n' "$chk" "${out:-<empty>}"; rc=1 ;;
            esac
          done
          exit "$rc"
