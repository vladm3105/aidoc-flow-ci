# Caller template for aidoc-flow-ci's reusable markdown-lint workflow.
#
# Single template (works for both PRIVATE + PUBLIC). The reusable installs
# markdownlint-cli2 via npm (ci/v1.9.4+; no blocked third-party action).
# PRIVATE consumers per OPS-0049 override runner_labels to
# '["self-hosted", "ci-runner", "single-use"]'.
#
# Companion starter config: copy install/templates/.markdownlint.json
# to your repo root for sensible rule defaults (or rely on cli2's
# auto-resolve and ship your own).
#
# ROLLOUT: a repo with existing markdown carries lint debt. To adopt WITHOUT
# bricking merges, set `fail-on-findings: false` (report-only — cli2 still
# emits ::error PR annotations but the job exits 0). Graduate to blocking
# (drop the flag; default is true) after a `markdownlint-cli2 --fix` pass +
# adding the check to branch protection.
# NOTE: `continue-on-error` is ILLEGAL on a reusable-call job — use the
# `fail-on-findings` input for report-only, never continue-on-error.

name: markdown-lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # CI-0025 / REPO_STANDARDS §23: ALLOWLIST of the code-changing events.
  # This caller feeds a REQUIRED context. Every event here other than a push or a
  # code-changing PR action fires at the CURRENT head SHA, and a cancelled required
  # check is not success — it is retained alongside any later success from a
  # separate run, so the rollup stays FAILURE and the PR is --admin-only. A label
  # write (audit-trail's documented `skip-audit-trail` hatch) or a reopen would do
  # it. Expressed as `==` so an empty `github` context yields false and cancels
  # nothing; a `!=` denylist would cancel everything in that degraded state.
  cancel-in-progress: >-
    ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
          && contains(fromJSON('["opened","synchronize"]'), github.event.action)) }}
jobs:
  call:
    uses: vladm3105/aidoc-flow-ci/.github/workflows/markdown-lint.yml@ci/v2.15.0
    with:
      globs: |
        **/*.md
        !node_modules
        !vendor
        !.git
      # Report-only rollout (recommended for a repo with existing lint debt):
      # fail-on-findings: false
      # PRIVATE consumers add this inside the existing `with:` block:
      # runner_labels: '["self-hosted", "ci-runner", "single-use"]'
