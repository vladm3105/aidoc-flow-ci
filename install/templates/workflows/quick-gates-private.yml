# quick-gates — v3 caller consolidating the PR lint checks into ONE job.
#
# A `workflow_call` reusable always gets its own runner, so each check paid a
# full provisioning cycle: on aidoc-flow-operations the audit-trail reusable took
# ~167s to run a grep, almost entirely provisioning. Composite actions run in
# THIS job and share one cycle.
#
# ── SCOPE: three checks, not four or five (PLAN-025 §3.2d) ───────────────────
# pre-commit + markdownlint + links. Deliberately NOT here:
#
#   audit-trail  — needs `types: [… labeled, unlabeled]` so its skip-label
#                  escape hatch can fire (D32). Adding those types would re-run
#                  lint on every label write, which ai-review/labeler/auto-merge
#                  do routinely. No single `types:` satisfies both, and
#                  audit-trail additionally needs a job-level event refusal (D31)
#                  and the D36 credential asymmetry — three defenses for one
#                  provisioning cycle. It stays its own workflow.
#   composition  — fires on pull_request_review + workflow_run, never
#                  pull_request. Only same-trigger checks can share a job.
#   secret-scan  — ubuntu-latest and fork-visible by design; the other scanners
#                  are self-hosted and fork-guarded (PLAN-025 P3a).
#
# ── D4: THE JOB ID IS THE REQUIRED STATUS CONTEXT ────────────────────────────
# Renders as `quick-gates`. Renaming the job id silently un-satisfies
# branch protection, which then never fires again. Migrate add-new → observe
# green → remove old → delete old callers, reading BOTH live protection AND
# rulesets (D19, D40) — never the branch-protection templates: canon's own
# `main` requires `call / markdownlint` and `suite`, neither of which appears in
# any template.
#
# ── PRIVATE VARIANT — self-hosted, and that is SAFE here ─────────────────────
# This job runs `pre-commit` over the PR's own files, i.e. it executes PR code.
# On a PUBLIC repo that means it must stay `ubuntu-latest` (D7) — see the
# `quick-gates.yml` sibling. On a PRIVATE repo there is no fork-PR surface, so
# the ephemeral single-use pool is both safe and REQUIRED: GitHub-hosted minutes
# on a private repo are OPS-0049 billing exposure and against workspace policy.
#
# D1 — WHY THIS FILE EXISTS AS A SEPARATE TEMPLATE. `install.sh --update`
# resolves each surface through manifest.json's `visibility_variants`. With no
# private variant it re-applies the label-less generic, the reusable's
# `ubuntu-latest` default wins, and jobs QUEUE FOREVER on a private repo — the
# defect ci/v2.1.0 shipped the variants to close. Do not merge these two files.
name: quick-gates

on:
  pull_request:

# D9: one job, one grant — a composite action has no declaration of its own, so
# this is the whole ceiling. None of the three checks writes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # D3 / CI-0025 / REPO_STANDARDS §23: ALLOWLIST of code-changing events, never a
  # blanket cancel. This job feeds a REQUIRED context. Every other event fires at
  # the CURRENT head SHA, and a cancelled required check is NOT success — it is
  # retained alongside any later success, so the rollup stays FAILURE and the PR
  # becomes --admin-only. Expressed as `==` so an empty `github` context yields
  # false and cancels nothing; a `!=` denylist would cancel everything in that
  # degraded state.
  cancel-in-progress: >-
    ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
          && contains(fromJSON('["opened","synchronize"]'), github.event.action)) }}

jobs:
  quick-gates:
    name: quick-gates
    runs-on: ["self-hosted", "ci-runner", "single-use"]
    # PLAN-025 §3.2b: a consolidated job's timeout is the SUM of the budgets it
    # absorbs (pre-commit 15 + markdownlint 10 + links 20), never the max and
    # never a round number picked by eye. An earlier draft shipped 15 — BELOW
    # what links alone needs — so a slow lychee run would have killed the two
    # checks that had already passed. Padding costs nothing: the runner is
    # released on completion either way.
    timeout-minutes: 45
    steps:
      # ONE checkout for all three actions — this is where the saving comes from.
      #
      # NO `ref:` — deliberately. On `pull_request` the default is the MERGE
      # commit (base+head), which is what the v2 pre-commit, markdown-lint and
      # links reusables lint. An earlier draft pinned
      # `github.event.pull_request.head.sha` here, copied from audit-trail; that
      # would have linted the branch tip instead, so a PR whose merge result is
      # dirty but whose tip is clean would go GREEN. Weaker, not stricter — and
      # it is why audit-trail is no longer in this job: it is the one check that
      # genuinely needs the head SHA, and it needs the credential too (D36).
      - name: Checkout (merge commit — parity with the v2 reusables)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint / format / security hooks
        uses: vladm3105/aidoc-flow-ci/actions/pre-commit@ci/v3.0.0

      - name: markdownlint
        uses: vladm3105/aidoc-flow-ci/actions/markdownlint@ci/v3.0.0

      # EVERY input passed explicitly, none left to a default. This is a
      # REQUIRED gate; a default that changes in a later release would change
      # what the gate does silently. An earlier draft passed only the token and
      # inherited `mode: external` + `fail-on-error: true`, which would have made
      # the blocking PR check do live external network link-checking.
      #
      # `mode: internal` (--offline) is the v2 PR-blocking posture. External link
      # rot is time-based, not change-based, so it belongs on the weekly
      # `links-external.yml` caller, non-blocking — NOT here.
      #
      # links takes the token as an INPUT: the `secrets` context is not available
      # inside a composite action, and without it lychee hits github.com
      # anonymous rate limits (PLAN-025 §3.2a).
      - name: links
        uses: vladm3105/aidoc-flow-ci/actions/links@ci/v3.0.0
        with:
          mode: internal
          fail-on-error: 'true'
          config-file: .lychee.toml
          github-token: ${{ secrets.GITHUB_TOKEN }}
