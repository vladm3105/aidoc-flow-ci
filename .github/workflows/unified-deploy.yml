# unified-deploy.yml — manual deployment of any service or all services.
#
# Triggered via workflow_dispatch. Allows deploying a single service or
# the entire stack. Useful for ad-hoc deploys, testing, or recovery.

name: Unified Deploy

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - all
          - llm-router
          - embedding-service
          - nginx
          - admin-ui
          - prometheus
          - alertmanager
          - grafana
          - jaeger
          - loki
          - alloy
      deploy_host:
        description: 'SSH target (user@host) or empty for local'
        required: false
        type: string
        default: ''
      deploy_dir:
        description: 'Deployment directory'
        required: true
        type: string
      health_url:
        description: 'Health check URL (for the primary service)'
        required: true
        type: string
      commit_sha:
        description: 'Specific commit SHA to deploy (leave empty for latest)'
        required: false
        type: string
        default: ''
      docker_compose_profile:
        description: 'Docker Compose profile'
        required: false
        type: string
        default: ''
      skip_smoke_test:
        description: 'Skip post-deploy smoke test'
        required: false
        type: boolean
        default: false
      runner_labels:
        description: 'JSON runner labels'
        required: false
        type: string
        default: '["self-hosted","deploy","staging"]'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.service }}
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Deploy service(s)
        env:
          SERVICE: ${{ inputs.service }}
          DEPLOY_HOST: ${{ inputs.deploy_host }}
          DEPLOY_DIR: ${{ inputs.deploy_dir }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PROFILE: ${{ inputs.docker_compose_profile }}
        run: |
          set -euo pipefail

          deploy_local() {
            cd "${DEPLOY_DIR}"

            # Checkout specific commit if provided
            if [ -n "${COMMIT_SHA}" ]; then
              echo "Checking out ${COMMIT_SHA}..."
              git fetch origin
              git checkout "${COMMIT_SHA}"
            else
              git pull origin staging
            fi

            # Build compose flags
            # Compose flags as an ARRAY, expanded via the set -u safe form
            # because it can be empty (see deploy-staging.yml for why a string
            # cannot be used here — SC2086, and quoting it would pass the whole
            # flag list as one argument).
            COMPOSE_FLAGS=()
            if [ -n "${PROFILE}" ]; then
              COMPOSE_FLAGS+=(--profile "${PROFILE}")
            fi

            if [ "${SERVICE}" = "all" ]; then
              echo "Deploying all services..."
              docker compose ${COMPOSE_FLAGS[@]+"${COMPOSE_FLAGS[@]}"} build
              docker compose ${COMPOSE_FLAGS[@]+"${COMPOSE_FLAGS[@]}"} up -d
            else
              echo "Deploying ${SERVICE}..."
              docker compose ${COMPOSE_FLAGS[@]+"${COMPOSE_FLAGS[@]}"} build "${SERVICE}"
              docker compose ${COMPOSE_FLAGS[@]+"${COMPOSE_FLAGS[@]}"} up -d "${SERVICE}"
            fi
          }

          if [ -n "${DEPLOY_HOST}" ]; then
            echo "Deploying to ${DEPLOY_HOST}:${DEPLOY_DIR}"
            ssh -o StrictHostKeyChecking=no "${DEPLOY_HOST}" "$(declare -f deploy_local); deploy_local"
          else
            echo "Deploying locally to ${DEPLOY_DIR}"
            deploy_local
          fi

      - name: Health check
        if: ${{ inputs.service != 'all' && inputs.health_url != '' }}
        env:
          HEALTH_URL: ${{ inputs.health_url }}
        run: |
          set -euo pipefail
          MAX_RETRIES=6
          RETRY_INTERVAL=10

          for i in $(seq 1 "${MAX_RETRIES}"); do
            echo "Health check attempt ${i}/${MAX_RETRIES}..."
            if curl -sf --max-time 5 "${HEALTH_URL}"; then
              echo "Health check passed"
              exit 0
            fi
            if [ "${i}" -lt "${MAX_RETRIES}" ]; then
              sleep "${RETRY_INTERVAL}"
            fi
          done
          echo "::error::Health check failed after ${MAX_RETRIES} attempts"
          exit 1

  smoke:
    name: Post-deploy smoke test
    needs: deploy
    if: ${{ !inputs.skip_smoke_test && inputs.service != 'all' && inputs.health_url != '' }}
    uses: ./.github/workflows/smoke-test.yml
    with:
      target_url: ${{ inputs.health_url }}
      runner_labels: ${{ inputs.runner_labels }}
    # NO `secrets:` block — see the same note in deploy-staging.yml. The callee
    # declares no secrets and reads none, so `secrets: inherit` would only widen
    # access, not enable anything.
