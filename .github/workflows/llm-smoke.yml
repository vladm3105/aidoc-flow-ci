name: LLM agent smoke

on:
  workflow_dispatch:
    inputs:
      runner_labels:
        description: JSON runner labels; use ubuntu-latest only for a publicly reachable endpoint
        required: true
        default: '["self-hosted", "ci", "ephemeral"]'
        type: string
      review_model:
        description: Review model alias, resolved by the endpoint LLM_URL names
        required: true
        default: ai-reviewer
        type: string
      allow_insecure_http:
        description: Allow HTTP for a controlled private-network endpoint
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Smoke review alias
        env:
          # ci/v4.0.0 (CI-0051): LLM_URL / LLM_API_KEY are the ONLY names resolved.
          # The LITELLM_* fallbacks were removed fleet-wide.
          LLM_URL: ${{ secrets.LLM_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ALLOW_INSECURE_HTTP: ${{ inputs.allow_insecure_http }}
          LLM_MODEL: ${{ inputs.review_model }}
        run: |
          set -euo pipefail
          printf 'Return JSON only: {"ok":true,"agent":"review"}' \
            | python3 scripts/llm_client.py --json --timeout 120 --output /tmp/review-smoke.json
          jq -e '.ok == true and .agent == "review"' /tmp/review-smoke.json >/dev/null
